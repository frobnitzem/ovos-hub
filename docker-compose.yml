---
x-podman:
  in_pod: false
#  #userns_mode: "keep-id:uid=1000,gid=1000" # docker method
#  in_pod: true # apply this setting at the pod level
#               # Note that in podman, all services in this file are started
#               # in a single "pod" (like a single host).
#  pod_args:
#    - "--userns=keep-id:uid=1000,gid=1000"
#    - "--network=ovos-net"         # Attach Pod to the shared network
#    - "--hostname=ovos-core"       # This DNS name is used by other pods

x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m
    max-size: "200m"
    max-file: "1"

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}

x-resource-limits: &resource-limits
  # TODO - adjust if needed
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 128M


x-volumes: &volumes
  volumes:
    # ovos
    - ${BASE_DIR}/config:/home/ovos/.config
    - ${BASE_DIR}/data:/home/ovos/.local/share
    - ${BASE_DIR}/cache:/home/ovos/.cache
    - ${BASE_DIR}/state:/home/ovos/.local/state
    - ${BASE_DIR}/tmp:/tmp/mycroft
    # audio
    - ~/.config/pulse/cookie:/home/ovos/.config/pulse/cookie:ro
   #- ${XDG_RUNTIME_DIR}/pipewire-0:${XDG_RUNTIME_DIR}/pipewire-0:ro
    - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse:ro
   #- ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native:ro
    # nltk
    - ${BASE_DIR}/nltk_data:/home/ovos/nltk_data

x-base: &base
  <<: [*volumes]
  restart: unless-stopped
  logging: *default-logging
  pull_policy: ${PULL_POLICY:-missing}
  environment:
    <<: *common-environment
  userns_mode: "keep-id:uid=1000,gid=1000"
  networks:
    - ovos-net

x-audio: &audio
  <<: *base
  devices:
    - /dev/snd
  environment:
    <<: *common-environment
    PULSE_SERVER: unix:${XDG_RUNTIME_DIR}/pulse/native
    PULSE_COOKIE: /home/ovos/.config/pulse/cookie
    XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
    DBUS_SESSION_BUS_ADDRESS: unix:path=${XDG_RUNTIME_DIR}/bus

services:
  ovos_messagebus:
    <<: [*base, *resource-limits]
    container_name: ovos_messagebus
    image: jarbasai/ovos-messagebus:$CORE_VERSION
    environment:
      OVOS_WEBSOCKET_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl --header 'Connection: Upgrade' --header 'Upgrade: Websocket' http://ovos_messagebus:8181/core || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  ovos_gui_websocket:
    <<: [*base, *resource-limits]
    container_name: ovos_gui_websocket
    image: jarbasai/ovos-gui-websocket:$CORE_VERSION
    depends_on:
      - ovos_messagebus
    healthcheck:
      test: ["CMD-SHELL", "curl --header 'Connection: Upgrade' --header 'Upgrade: Websocket' http://ovos_messagebus:18181/core || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  ovos_phal:
    <<: [*audio, *resource-limits]
    container_name: ovos_phal
    image: jarbasai/ovos-phal:$CORE_VERSION
    # Only use privileged if absolutely necessary for hardware access
    # TODO - adjust depending on installed PHAL plugins
    #privileged: true
    # Use specific capabilities instead of privileged mode where possible
    #cap_add:
    #  - SYS_ADMIN
    #  - DAC_OVERRIDE
    depends_on:
      - ovos_messagebus

  ovos_listener:
    <<: [*audio, *resource-limits]
    container_name: ovos_listener
    # pick one
    image: jarbasai/ovos-dinkum-listener:$CORE_VERSION
    #image: jarbasai/ovos-simple-listener:$CORE_VERSION
    #image: jarbasai/ovos-classic-listener:$CORE_VERSION
    depends_on:
      - ovos_messagebus
    deploy:
      resources:
        limits:
          memory: 512M
          cpu: 1
        reservations:
          memory: 128M

  ovos_audio:
    <<: [*audio, *resource-limits]
    container_name: ovos_audio
    image: jarbasai/ovos-audio:$CORE_VERSION
    depends_on:
      - ovos_messagebus

  ovos_core:
    <<: [*audio, *resource-limits]
    container_name: ovos_core
    image: jarbasai/ovos-core:$CORE_VERSION
    depends_on:
      - ovos_messagebus

