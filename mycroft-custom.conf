{
  "log_level": "INFO",
  "logs": {
    "path": "stdout"
  },
  "play_wav_cmdline": "play %1",
  "play_mp3_cmdline": "play %1",
  "lang": "en-US",
  "skills": {
    "installer": {
      "allow_pip": true,
      "allow_alphas": true
    }
  },
  "gui": {
    "extension": "ovos-gui-plugin-shell-companion",
    "gui_file_host_path": "/home/ovos/.cache/gui_files"
  },
  "websocket": {
    "host": "ovos_messagebus",
    "port": 8181,
    "route": "/core",
    "ssl": false,
    "shared_connection": true,
    "max_msg_size": 100
  },
  "gui_websocket": {
    "host": "ovos_gui_websocket",
    "base_port": 18181,
    "route": "/gui",
    "ssl": false
  },
  "PHAL": {
    "admin": {
      "ovos-PHAL-plugin-system": {
        "enabled": true,
        "ovos-PHAL-plugin-alsa": {
          "enabled": true
        },
        "ovos-PHAL-plugin-pipewire": {
          "enabled": false
        }
      }
    }
  },
  "stt": {
    "module": "ovos-stt-plugin-server",
    "fallback_module": "",
    "ovos-stt-plugin-server": {"url": "http://ovos_stt_whisper:8080/stt"}
  },
  "tts": {
    "module": "ovos-tts-plugin-server",
    "ovos-tts-plugin-server": {
        "host": "http://ovos_tts_phoonnx:9666",
        "v2": false,
        "verify_ssl": true,
        "tts_timeout": 5
     }
  },
  "listener": {
    "wake_word": "hey_mycroft",
    "stand_up_word": "wake_up",
    "microphone": {
      "module": "ovos-microphone-plugin-alsa",
      "config": { "device": "pulse" }
    },
    "vad_pre_wake_enabled": true,
    "VAD": {
     "module": "ovos-vad-plugin-silero",
     "ovos-vad-plugin-silero": {"threshold": 0.2},
     "ovos-vad-plugin-webrtcvad": {"vad_mode": 3}
    },
    "speech_begin": 0.1,
    "silence_end": 0.5,
    "recording_timeout": 10.0,
    "recording_timeout_with_silence": 3.0,
    "recording_mode_max_silence_seconds": 30.0,
    "remove_silence": true,
    "hybrid_listen": false,
    "listen_timeout": 45
  },
  "Audio": {
    "backends": {
      "vlc": {
        "type": "ovos_vlc",
        "active": true,
        "flags": "--aout=pulse"
      }
    }
  }
}
