---
x-podman: &podman
  in_pod: false

x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m
    max-size: "200m"
    max-file: "1"

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}

x-skill-resource-limits: &skill-resource-limits
  deploy:
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 64M

x-skill-base: &skill-base
  <<: [*skill-resource-limits]
  restart: unless-stopped
  logging: *default-logging
  userns_mode: "keep-id:uid=1000,gid=1000"
  environment:
    <<: *common-environment
  network_mode: host
  volumes:
    - ${BASE_DIR}/config/mycroft:/home/ovos/.config/mycroft
    - ${BASE_DIR}/data/mycroft:/home/ovos/.local/share/mycroft
    - ${BASE_DIR}/cache/mycroft:/home/ovos/.cache/mycroft
    - ${BASE_DIR}/cache/ovos_gui:/home/ovos/.cache/ovos_gui
    - ${BASE_DIR}/state/mycroft:/home/ovos/.local/state/mycroft
    - ${BASE_DIR}/tmp:/tmp/mycroft
    - ${BASE_DIR}/nltk_data:/home/ovos/nltk_data

services:
  ovos_skill_wikipedia:
    <<: *skill-base
    build:
      context: ./skill-wikipedia
      dockerfile: Dockerfile
    container_name: ovos_skill_wikipedia
    hostname: ovos_skill_wikipedia
    image: jarbasai/ovos-skill-wikipedia:latest

